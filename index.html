<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>バレー動画タグ付け</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,sans-serif;margin:0;padding:10px;background:#111;color:#eee;-webkit-text-size-adjust:100%}
input,button,textarea{font-size:16px;padding:8px;border-radius:8px;border:none}
button{color:#fff;background:#555;touch-action:manipulation}
button:active{filter:brightness(1.4)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
#wrap{width:100%;max-width:960px;aspect-ratio:16/9;background:#000;position:relative}
#player{position:absolute;inset:0;width:100%;height:100%}
#tap{position:absolute;left:0;right:0;top:64px;bottom:76px;display:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#tap.on{display:block}
.tapfx{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);color:#fff;padding:10px 16px;border-radius:24px;font-weight:bold;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
#tapL{left:6%}#tapR{right:6%}#tapS{top:12%;left:50%;transform:translateX(-50%)}
#now{font-size:13px;color:#aaa;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg{color:#f99;font-size:13px;min-height:1.2em;margin:4px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.btns button{padding:16px 6px;font-weight:bold;font-size:17px}
.sa{background:#1e6fd9}.sb{background:#d93a1e}.sp{background:#c99200}.rv{background:#8e3ad9}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 0;z-index:10}
.modal.on{display:flex}
.mbox{background:#222;border-radius:12px;padding:14px;width:100%;max-width:440px;max-height:82vh;overflow:auto}
.mt{font-weight:bold}
#mtitle{font-weight:bold;color:#d9b3ff}
.ctypes label,.clist label{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid #333;cursor:pointer}
.ctypes input,.clist input{width:22px;height:22px;flex:none;margin:0}
.clist{max-height:40vh;overflow:auto;border:1px solid #333;border-radius:8px;padding:0 6px;margin-bottom:6px}
.clist .cset{color:#7fe;font-size:13px;font-weight:bold;padding:6px 4px;border-bottom:1px solid #333}
.mapv{border:1px solid #444;border-radius:8px;padding:8px;margin:6px 0}
.mapv label{display:flex;align-items:flex-start;gap:8px;padding:6px 2px;cursor:pointer}
.mapv input{width:20px;height:20px;flex:none;margin:2px 0 0}
.clist .vsub{display:block;font-size:12px;color:#999}
.clist .ct{color:#aaa;min-width:3.5em}
#mmemo{width:100%;margin:10px 0;background:#111;color:#eee;border:1px solid #555}
#plsel{display:none;width:100%;margin:6px 0 0;padding:10px 8px;font-size:16px;background:#222;color:#eee;border:1px solid #444;border-radius:8px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.tools button{padding:12px 4px}
#plnav{display:none;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
#plnav button{padding:8px;background:#333}
#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:#0a0;color:#fff;padding:8px 16px;border-radius:20px;font-weight:bold;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
td,th{border-bottom:1px solid #333;padding:5px 3px;text-align:left}
th{white-space:nowrap}
tbody tr{cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.chips button{padding:6px 12px;font-size:14px;background:#333;border-radius:16px}
.chips button.on{background:#b8ebc8;color:#0d3b1e;font-weight:bold;box-shadow:0 0 0 2px #4caf6e}
tbody td:first-child,thead th:first-child{padding-left:12px}
tr.new td:first-child{box-shadow:inset 4px 0 #fc0}
tr.cur td:first-child{box-shadow:inset 4px 0 #39f}
tr.new.cur td:first-child{box-shadow:inset 4px 0 #fc0,inset 8px 0 #39f}
td.sc{white-space:nowrap;font-weight:bold}
tr.set td{background:#123d3b;color:#7fe;font-weight:bold}
.setbtn{width:100%;padding:12px;background:#0b7a75;font-weight:bold;margin:0 0 6px}
td input{width:100%;padding:4px;font-size:14px}
.del{background:#500;padding:4px 10px}
#out{display:none;margin-top:8px}
#out textarea{width:100%;height:140px;font-size:12px;background:#222;color:#eee}
.lead{display:flex;align-items:center;gap:6px;font-size:14px;color:#ccc;margin:4px 0 6px}
.lead select{font-size:16px;padding:6px;border-radius:8px;background:#222;color:#eee;border:1px solid #444}
.note{font-size:12px;color:#999}
</style></head><body>
<div id="toast"></div>
<div id="modal" class="modal"><form id="mform" class="mbox">
<div id="mtitle"></div>
<input id="mmemo" placeholder="メモ（省略可）" autocomplete="off" enterkeyhint="done">
<div class="row" style="margin:0"><button type="button" onclick="closeMemo(false)" style="flex:1">キャンセル</button><button type="submit" class="rv" style="flex:1;font-weight:bold">記録する</button></div>
</form></div>
<div id="mundo" class="modal"><div class="mbox">
<div class="mt">この記録を取り消しますか？</div>
<div id="undotxt" style="margin:12px 0;color:#ccc"></div>
<div class="row" style="margin:0"><button onclick="closeUndo(false)" style="flex:1">キャンセル</button><button onclick="closeUndo(true)" style="flex:1;background:#b33;font-weight:bold">取り消す</button></div>
</div></div>
<div id="mexp" class="modal"><div class="mbox">
<div class="mt">CSV書き出し</div>
<div class="row" style="margin:8px 0"><button onclick="expPick(false)" style="flex:1;background:#333">再生中の動画だけ</button><button onclick="expPick(true)" style="flex:1;background:#333">すべて選ぶ</button></div>
<div id="evids" class="clist"></div>
<div class="row" style="margin:10px 0 0"><button onclick="closeExp()" style="flex:1">キャンセル</button><button id="ego" onclick="doExp()" style="flex:1;background:#2a5;font-weight:bold"></button></div>
</div></div>
<div id="mimp" class="modal"><div class="mbox">
<div class="mt">CSV読み込み</div>
<div id="ifile" class="note" style="margin:4px 0 8px"></div>
<div id="imap"></div>
<div id="itypes" class="ctypes"></div>
<div class="note" style="margin-top:8px">今の記録に追加します。同じ記録、ほかの人が記録した同じサーブ（6秒以内）・セット切替（5分以内）は重複として取り込みません。注目スパイク・見返したいはメモが違えば別の記録として追加します。重複した記録のメモは今のメモにつなげます。</div>
<div class="row" style="margin:10px 0 0"><button onclick="closeImp()" style="flex:1">キャンセル</button><button id="igo" onclick="doImp()" style="flex:1;background:#2a5;font-weight:bold"></button></div>
</div></div>
<div id="mcopy" class="modal"><div class="mbox">
<div class="mt">コメント欄用にコピー</div>
<div id="cvid" class="note" style="margin:4px 0 8px"></div>
<div id="ctypes" class="ctypes"></div>
<button id="ceach" onclick="toggleEach()" style="width:100%;background:#333;margin:10px 0 6px"></button>
<div id="clist" class="clist" style="display:none"></div>
<div class="row" style="margin:8px 0 0"><button onclick="closeCopy()" style="flex:1">閉じる</button><button id="cgo" onclick="doCopy()" style="flex:1;background:#2a5;font-weight:bold"></button></div>
</div></div>
<div class="row">
<input id="url" placeholder="YouTubeの動画・再生リストのURL" style="flex:1 1 220px"><button onclick="load()">読込</button>
</div>
<div class="row">
<input id="ta" value="Aチーム" style="flex:1"><input id="tb" value="Bチーム" style="flex:1">
<button onclick="copyLink()" style="background:#2a5">リンクをコピー</button>
</div>
<div id="wrap"><div id="player"></div><div id="tap"><div id="tapL" class="tapfx"></div><div id="tapS" class="tapfx">2倍速 ▶▶</div><div id="tapR" class="tapfx"></div></div></div>
<div id="now"></div>
<select id="plsel" onchange="pick(this.value)"></select>
<div id="plnav"><button onclick="ready&&P.previousVideo()">◀ 前の動画</button><button onclick="ready&&P.nextVideo()">次の動画 ▶</button></div>
<div id="msg"></div>
<div class="btns">
<button class="sa" onclick="serveBtn(0)">サーブ <span id="la"></span></button>
<button class="sb" onclick="serveBtn(1)">サーブ <span id="lb"></span></button>
<button class="sp" onclick="rec('注目スパイク')">注目スパイク</button>
<button class="rv" onclick="askMemo()">見返したい</button>
</div>
<button class="setbtn" onclick="rec('セット開始')">セット切替（ここから次のセット）</button>
<div class="tools">
<button onclick="askUndo()">取り消す</button>
<button onclick="copyComment()" style="background:#2a5">コメント欄用にコピー</button>
<button onclick="exportCSV()">CSV書き出し</button>
<button onclick="$('file').click()">CSV読み込み</button>
</div>
<label class="lead">記録する時刻：ボタンを押した<select id="lead"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select>秒前</label>
<input type="file" id="file" accept=".csv,text/csv,text/plain" style="display:none" onchange="importCSV(this)">
<div id="out">
<div class="row"><button onclick="copyText($('csvtxt').value,'コピーしました')">コピー</button><button onclick="$('out').style.display='none'">閉じる</button></div>
<textarea id="csvtxt" readonly></textarea>
<div class="note" id="outnote"></div>
</div>
<div class="row" style="justify-content:space-between;align-items:center;margin-top:8px">
<span id="count" class="note"></span>
<span><button id="sortbtn" onclick="toggleSort()" style="background:#333;padding:6px 12px"></button>
<button onclick="clearVideo()" style="background:#400;padding:6px 12px">この動画の記録を消去</button></span>
</div>
<div id="flt" class="chips"></div>
<table><thead><tr><th>時刻</th><th>セット-R</th><th>点数</th><th>種類</th><th>サーブ</th><th>メモ</th><th></th></tr></thead><tbody id="list"></tbody></table>
<script>
const $=id=>document.getElementById(id);
let P=null,ready=false,L=[],seq=0,order={};
let TT={},plIds=[],TN={},VW={},shownV='';
let cur={list:'',v:''},wantV='',wantCue=false,pendingSeek=null,initSrc=null,initCue=true;
const ERR={2:'URLの形式が正しくないかもしれません',5:'このブラウザでは再生できない動画です',100:'動画が見つかりません（非公開・削除の可能性）',101:'この動画は埋め込み再生が禁止されています',150:'この動画は埋め込み再生が禁止されています',153:'開き方の制限で再生できません（Webアドレスで開いてください）'};
function msg(t){$('msg').textContent=t}
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,800)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ---------- YouTubeのURLを読む ---------- */
function parseT(s){if(!s)return 0;s=String(s);if(/^\d+$/.test(s))return +s;
  const m=s.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):0}
function parseYT(s){s=(s||'').trim();if(!s)return null;
  if(/^[\w-]{11}$/.test(s))return{v:s,list:'',index:0,t:0};
  if(/^(PL|UU|OL|FL|LL)[\w-]{10,}$/.test(s))return{v:'',list:s,index:0,t:0};
  let u;try{u=new URL(/^https?:\/\//i.test(s)?s:'https://'+s)}catch(e){return null}
  const q=u.searchParams;let v=q.get('v')||'';
  const m=u.pathname.match(/^\/(?:shorts|embed|live|v)\/([\w-]{11})/);if(!v&&m)v=m[1];
  if(!v&&/youtu\.be$/i.test(u.hostname))v=u.pathname.slice(1,12);
  if(!/^[\w-]{11}$/.test(v))v='';
  const list=q.get('list')||'';
  if(!v&&!list)return null;
  return{v,list,index:+q.get('index')||0,t:parseT(q.get('t')||q.get('start'))}}
function ytURL(s){if(s.list&&s.v)return'https://www.youtube.com/watch?v='+s.v+'&list='+s.list;
  if(s.list)return'https://www.youtube.com/playlist?list='+s.list;return'https://www.youtube.com/watch?v='+s.v}

/* ---------- このツールのURLに入っている指定を読む ----------
   ?yt=<YouTubeのURL>  または  ?v=<動画ID>&list=<再生リストID>
   ほか &t=90 (開始秒)  &index=3 (再生リストの何本目)  &ta=チーム名  &tb=チーム名 */
function fromPage(){let q;try{q=new URLSearchParams(location.search)}catch(e){return null}
  if(q.get('ta'))$('ta').value=q.get('ta');if(q.get('tb'))$('tb').value=q.get('tb');
  let src=q.get('yt')?parseYT(q.get('yt')):null;
  const v=q.get('v'),list=q.get('list');
  if(v||list){src=src||{v:'',list:'',index:0,t:0};
    if(v&&/^[\w-]{11}$/.test(v))src.v=v;if(list)src.list=list}
  if(src){if(q.get('index'))src.index=+q.get('index')||0;if(q.get('t'))src.t=parseT(q.get('t'))}
  return src&&(src.v||src.list)?src:null}

/* ---------- プレーヤー ---------- */
window.onYouTubeIframeAPIReady=function(){
  P=new YT.Player('player',{width:'100%',height:'100%',playerVars:{rel:0,playsinline:1},
    events:{
      onReady:()=>{ready=true;msg('');if(initSrc){const s=initSrc;initSrc=null;openSrc(s,initCue)}},
      onStateChange:onState,
      onError:e=>msg(ERR[e.data]||('動画エラー（コード '+e.data+'）'))
    }});
};
(function(){const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';
  s.onerror=()=>msg('YouTubeのプレーヤーを読み込めませんでした（通信を確認してください）');
  document.head.appendChild(s);
  setTimeout(()=>{if(!ready)msg('プレーヤーの準備に時間がかかっています…')},5000);})();

function vidNow(){try{return P.getVideoData().video_id||''}catch(e){return''}}
function openSrc(src,cue){if(!src)return;
  if(src.list!==cur.list){plIds=[];$('plsel').style.display='none'}
  cur={list:src.list,v:src.v};$('url').value=ytURL(src);
  $('plnav').style.display=src.list?'grid':'none';
  if(!ready){initSrc=src;initCue=cue;msg('プレーヤー準備中…準備できたら自動で読み込みます');return}
  msg('');
  if(src.list){
    wantV=src.index?'':src.v;wantCue=cue;
    pendingSeek=src.t?{v:src.v||'*',t:src.t}:null;
    const o={list:src.list,listType:'playlist',index:src.index?src.index-1:0};
    cue?P.cuePlaylist(o):P.loadPlaylist(o);
  }else{
    wantV='';pendingSeek=null;
    const o={videoId:src.v,startSeconds:src.t||0};
    cue?P.cueVideoById(o):P.loadVideoById(o);
  }
  setTimeout(updateURL,0);
}
function load(){const s=parseYT($('url').value);if(!s){msg('YouTubeの動画か再生リストのURLを入れてください');return}openSrc(s,false)}
function onState(e){const s=e.data;
  $('tap').classList.toggle('on',s===1||s===2||s===3);
  if(wantV&&(s===1||s===3||s===5)){let pl=null;try{pl=P.getPlaylist()}catch(x){}
    if(pl&&pl.length){const idx=pl.indexOf(wantV);wantV='';
      if(idx>=0&&idx!==P.getPlaylistIndex()){
        wantCue?P.cuePlaylist({list:cur.list,listType:'playlist',index:idx}):P.playVideoAt(idx);return}}}
  if(pendingSeek&&s===1){const id=vidNow();
    if(pendingSeek.v==='*'||pendingSeek.v===id){const t=pendingSeek.t;pendingSeek=null;P.seekTo(t,true)}}
  showNow();updateURL();
}
function showNow(){if(!ready)return;let t='';
  try{const d=P.getVideoData(),pl=P.getPlaylist();
    if(d.video_id&&d.title&&TT[d.video_id]!==d.title){TT[d.video_id]=d.title;selLater()}
    if(cur.list&&pl&&pl.length)t=(P.getPlaylistIndex()+1)+' / '+pl.length+' 本目　';t+=d.title||''}catch(e){}
  $('now').textContent=t;plSync();syncNames()}

/* ---------- 再生リストの動画一覧 ----------
   プレーヤーからは動画IDしか取れないので、タイトルは oEmbed で1本ずつ取りに行く */
function plSync(){const sel=$('plsel');
  if(!cur.list){if(plIds.length){plIds=[];sel.style.display='none'}return}
  let pl=null,i=-1;try{pl=P.getPlaylist();i=P.getPlaylistIndex()}catch(e){}
  if(!pl||!pl.length)return;
  if(pl.join()!==plIds.join()){plIds=pl.slice();drawSel();fetchTitles(plIds)}
  else if(i>=0)sel.value=String(i)}
function drawSel(){if(!plIds.length)return;const sel=$('plsel'),cnt={};let i=-1;
  L.forEach(e=>{if(e.type!=='セット開始')cnt[e.v]=(cnt[e.v]||0)+1});
  try{i=P.getPlaylistIndex()}catch(e){}
  sel.innerHTML=plIds.map((v,k)=>{const t=TT[v]===undefined?'（タイトル読み込み中…）':TT[v]||'（タイトルを取得できません）';
    return`<option value="${k}">${k+1}. ${esc(t)}${cnt[v]?'　［'+cnt[v]+'件］':''}</option>`}).join('');
  sel.value=String(i>=0?i:0);sel.style.display='block'}
function selLater(){clearTimeout(selLater.h);selLater.h=setTimeout(drawSel,300)}
function pick(i){if(!ready)return;wantV='';pendingSeek=null;P.playVideoAt(+i)}
let OE=['https://www.youtube.com/oembed?format=json&url=','https://noembed.com/embed?url='],fetchGen=0;
async function getTitle(v){const w=encodeURIComponent('https://www.youtube.com/watch?v='+v);
  for(const u of OE.slice()){try{const r=await fetch(u+w);if(!r.ok)continue;const j=await r.json();if(j&&j.title)return j.title}
    catch(e){if(OE.length>1)OE=OE.filter(x=>x!==u)}}  // 通信自体が通らない取得先は以後使わない
  return''}
function fetchTitles(ids){const g=++fetchGen,q=ids.filter(v=>TT[v]===undefined);
  const work=async()=>{while(q.length&&g===fetchGen){const v=q.shift();const t=await getTitle(v);
    if(TT[v]===undefined||t)TT[v]=t;selLater()}};
  for(let k=0;k<4;k++)work()}

/* ---------- 動画の上のタップ ----------
   iPadなどの埋め込みプレーヤーはダブルタップで10秒スキップできないので、上に透明な層を重ねて自前でやる。
   左右をダブルタップで10秒戻す・進める（続けてタップするとさらに10秒ずつ）。1回タップは再生/一時停止。
   長押ししている間は2倍速。
   下の操作バー（シークバー・全画面など）は覆わない。
   最初の再生はプレーヤー自体をタップしないと始まらない端末があるので、再生が始まるまでは層を出さない */
let tapT=0,tapSide='',tapN=0,tapH=null,skipTo=0;
/* 長押し2倍速。押して0.5秒たったら2倍速にし、指を離したら元の速さに戻す */
let lpH=null,lpOn=false,lpUsed=false,lpRate=1,lpX=0,lpY=0;
function lpEnd(){clearTimeout(lpH);lpH=null;if(!lpOn)return;lpOn=false;$('tapS').style.opacity=0;try{P.setPlaybackRate(lpRate)}catch(e){}}
$('tap').addEventListener('pointerdown',ev=>{lpUsed=false;lpX=ev.clientX;lpY=ev.clientY;clearTimeout(lpH);
  lpH=setTimeout(()=>{lpUsed=true;tapSide='';clearTimeout(tapH);  // 長押しはタップとして扱わない
    let s=-1;try{s=P.getPlayerState()}catch(e){}if(s!==1&&s!==3)return;
    try{lpRate=P.getPlaybackRate()||1}catch(e){lpRate=1}
    lpOn=true;P.setPlaybackRate(2);$('tapS').style.opacity=1},500)});
$('tap').addEventListener('pointermove',ev=>{if(!lpOn&&lpH&&Math.hypot(ev.clientX-lpX,ev.clientY-lpY)>15){clearTimeout(lpH);lpH=null}});
['pointerup','pointercancel'].forEach(k=>window.addEventListener(k,lpEnd));
$('tap').addEventListener('contextmenu',ev=>ev.preventDefault());
function tapFx(id,t){const e=$(id);e.textContent=t;e.style.opacity=1;clearTimeout(e.h);e.h=setTimeout(()=>e.style.opacity=0,600)}
function togglePlay(){if(!ready)return;let s=-1;try{s=P.getPlayerState()}catch(e){}
  if(s===1||s===3)P.pauseVideo();
  else{P.playVideo();
    // 再生できなかったら層を外して、次のタップはプレーヤーに直接届くようにする
    setTimeout(()=>{let t=-1;try{t=P.getPlayerState()}catch(e){}if(t!==1&&t!==3)$('tap').classList.remove('on')},1000)}}
$('tap').addEventListener('click',ev=>{if(lpUsed){lpUsed=false;return}
  const r=$('tap').getBoundingClientRect(),x=(ev.clientX-r.left)/r.width,now=Date.now();
  const side=x<.4?'L':x>.6?'R':'C';
  if(side!=='C'&&side===tapSide&&now-tapT<350){clearTimeout(tapH);tapN++;
    let base=skipTo;if(tapN===1)try{base=P.getCurrentTime()}catch(e){}
    let dur=0;try{dur=P.getDuration()}catch(e){}
    skipTo=Math.max(0,base+(side==='L'?-10:10));if(dur)skipTo=Math.min(skipTo,dur-1);
    P.seekTo(skipTo,true);tapFx('tap'+side,side==='L'?'◀◀ '+tapN*10+'秒':tapN*10+'秒 ▶▶');
  }else{tapN=0;clearTimeout(tapH);
    if(side==='C')togglePlay();else tapH=setTimeout(togglePlay,350)}

/* ---------- 記録 ---------- */
function fmt(t){t=Math.floor(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')}
/* ---------- チーム名（動画ごと） ----------
   TN[動画ID]={a,b}: 記録の中のA・Bのチーム名。CSVにはこの名前で書き出す。
   VW[動画ID]={a,b,flip}: ほかの人のCSVに合わせてA・Bや名前を変えた動画だけにある、自分用の表示名。
     a・b は記録上のA・Bを自分が何と呼んでいるか。flip=true なら、左の入力欄・左のサーブボタンが記録上のBにあたる。
   VW がない動画は、記録上の名前をそのまま表示し、左がA。
   名前を書き換えたときか、最初に記録したときに、その動画の名前として保存する。
   まだ名前のない動画を開いたら、再生リストで手前にある一番近い動画の名前、なければ今の入力欄の名前を仮に出す */
function inNames(){return{a:$('ta').value,b:$('tb').value}}
function lside(v){return VW[v]&&VW[v].flip?'B':'A'}
function oside(x){return x==='A'?'B':x==='B'?'A':x}
function tnI(x,v){const n=TN[v]||inNames();return x==='A'?n.a:x==='B'?n.b:''}  // 記録上の名前
function tn(x,v){const w=VW[v];if(w&&(x==='A'||x==='B'))return w[x.toLowerCase()];return tnI(x,v)}  // 表示用の名前
function dispLR(v){const l=lside(v);return{a:tn(l,v),b:tn(oside(l),v)}}  // 左・右の表示名
function vsText(v){const n=dispLR(v);return n.a+' vs '+n.b}
function defNames(v){const k=cur.list?plIds.indexOf(v):-1;
  for(let i=k-1;i>=0;i--)if(TN[plIds[i]])return dispLR(plIds[i]);
  return inNames()}
function syncNames(){const v=vidNow();if(!v||v===shownV)return;shownV=v;
  const n=TN[v]?dispLR(v):defNames(v);$('ta').value=n.a;$('tb').value=n.b;draw();updateURL()}
function namesFromInputs(v){const n=inNames();
  if(VW[v]){const l=lside(v).toLowerCase();VW[v][l]=n.a;VW[v][l==='a'?'b':'a']=n.b}else TN[v]=n}
/* サーブボタン: 0=左, 1=右。左右は表示の並び、記録はその動画の記録上のA・Bで */
function serveBtn(k){const l=lside(vidNow());rec('サーブ',k?oside(l):l)}
function sortL(){L.sort((a,b)=>(order[a.v]-order[b.v])||(a.t-b.t))}
function addOrder(v,pi){if(!(v in order))order[v]=pi>=0?pi:1e6+Object.keys(order).length}
/* 記録する時刻は、押した時刻から何秒前にするか（プレーが起きてから押すまでの遅れの分）。ブラウザに覚えておく */
function leadSec(){return +$('lead').value||0}
try{const x=localStorage.getItem('vt_lead');if(x!==null){const k=Math.min(10,Math.max(0,Math.round(+x)||0));$('lead').value=String(k)}}catch(e){}

/* 押した瞬間の動画・時刻を取る */
function snap(){
  if(!ready||!P.getCurrentTime){msg('先に動画を読み込んでください');return null}
  const v=vidNow();if(!v){msg('動画が再生されていません');return null}
  syncNames();if(!TN[v])TN[v]=inNames();
  const t=+Math.max(0,P.getCurrentTime()-leadSec()).toFixed(2);let pi=-1,title='';
  try{title=P.getVideoData().title||'';if(cur.list)pi=P.getPlaylistIndex()}catch(e){}
  return{t,v,pi,title,list:cur.list}}
/* 記録ごとの固有番号。CSVで人に渡しても同じ記録だとわかるようにする */
function newUid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function rec(type,side=''){const sn=snap();if(sn)addRec(sn,type,side,'')}

  addOrder(v,pi);if(title)TT[v]=title;
  L.push({t,type,side,memo,n:++seq,uid:newUid(),v,pi:pi>=0?pi:-1,list:sn.list,title});sortL();draw();

/* 見返したい：一時停止してメモを入れてもらい、「記録する」で押した時点の時刻とメモを記録する。

let pendRV=null;

function holdPlay(){let s=-1;try{s=P.getPlayerState()}catch(e){}const was=s===1||s===3;if(was)try{P.pauseVideo()}catch(e){}return was}

/* 取り消す：最後に記録したものを、確認してから消す */
let pendUndo=null;
function recLabel(e,i){const C=calc();

  return fmt(e.t)+'　'+e.type+(e.side?'（'+tn(e.side,e.v)+'）':'')+(e.memo.trim()?'　'+e.memo.trim():'')}

  L.forEach((e,i)=>{if(e.v===vv&&(k<0||e.n>L[k].n))k=i});

  pendUndo={n:L[k].n,resume:holdPlay()};$('undotxt').textContent=recLabel(L[k],k);$('mundo').classList.add('on')}

/* セット番号とラリー番号。動画ごとに第1セットから数える。
   セット切替は、そのセットでサーブが1本以上あったときだけ次のセットに進む
   （試合開始前に押しても第1セットのまま） */
/* 点数（そのラリーが始まる時点の A-B）。ラリーに勝ったチームが次にサーブするので、
   セットの2本目以降のサーブは、サーブしたチームの1点として数える。サーブ以外の記録は直前のサーブと同じ点数 */
function calc(){let s=1,r=0,pv=null,served=false,a=0,b=0;
  return L.map(e=>{if(e.v!==pv){pv=e.v;s=1;r=0;served=false;a=b=0}
    if(e.type==='セット開始'){if(served){s++;r=0;served=false;a=b=0}return{s,r:'',a:'',b:''}}
    if(e.type==='サーブ'){if(served){if(e.side==='A')a++;else if(e.side==='B')b++}r++;served=true}
    return served?{s,r,a,b}:{s,r,a:'',b:''}})}
let flt='';function setFlt(t){flt=t;draw()}

/* 表に出すのは今の動画の記録だけ（ほかの動画の記録も保存はされている） */

/* 再生位置のすぐ前の記録（表に出ている行のうち、時刻が今の再生位置以下で一番遅いもの）に青い線を付ける */

/* ---------- YouTubeのコメント用 ----------
   今の動画の記録だけを「時刻 種類」の行にする。時刻はコメント欄でリンクになる。
   時刻は記録した時刻そのまま */
function showOut(text,note){$('csvtxt').value=text;$('outnote').textContent=note;$('out').style.display='block'}
/* sel: コピーする記録の番号(n)。セットの見出しは、選んだ記録があるセットにだけ付ける */
function commentText(v,sel){const C=calc(),out=[vsText(v)],st={};let ps=0,n=0;
  L.forEach((e,i)=>{if(e.v!==v)return;const s=C[i].s;
    if(e.type==='セット開始'){if(!(s in st))st[s]=e.t;return}
    if(!sel.has(e.n))return;
    if(s!==ps){out.push('',s in st?fmt(st[s])+' ━━ 第'+s+'セット開始 ━━':'━━ 第'+s+'セット ━━');ps=s}
    const m=e.memo.trim();n++;
    out.push(fmt(e.t)+' '+e.type+(e.side?'（'+tn(e.side,v)+'）':'')+(m?' - '+m:''))});
  return{text:out.join('\n'),n}}
/* コピーする記録を選ぶ画面。種類でまとめて選べて、「一つずつ選ぶ」で記録ごとにも選べる。
   外した種類はブラウザに覚えておき、次に開いたときも外しておく */
let cV='',cSel=new Set(),cEach=false;
function cRecs(){return L.map((e,i)=>({e,i})).filter(x=>x.e.v===cV)}
function cOff(){try{return JSON.parse(localStorage.getItem('vt_coff')||'[]')}catch(e){return[]}}
function copyComment(){if(!L.length){msg('まだ記録がありません');return}
  const vs=[...new Set(L.map(e=>e.v))];let v=vidNow();
  if(!vs.includes(v)){if(vs.length===1)v=vs[0];else{msg('この動画の記録がありません');return}}
  cV=v;const off=cOff();cSel=new Set(cRecs().filter(x=>x.e.type!=='セット開始'&&!off.includes(x.e.type)).map(x=>x.e.n));
  cEach=false;$('cvid').textContent=(TT[v]||v)+'　'+vsText(v);
  drawCopy();$('mcopy').classList.add('on')}
function drawCopy(){const R=cRecs().filter(x=>x.e.type!=='セット開始'),C=calc(),types=[...new Set(R.map(x=>x.e.type))];
  $('ctypes').innerHTML=types.map((t,k)=>{const all=R.filter(x=>x.e.type===t),on=all.filter(x=>cSel.has(x.e.n)).length;
    return`<label><input type="checkbox" data-k="${k}" ${on===all.length?'checked':''}>${esc(t)}<span class="note">（${on}/${all.length}件）</span></label>`}).join('');
  $('ctypes').querySelectorAll('input').forEach(inp=>{const t=types[+inp.dataset.k],all=R.filter(x=>x.e.type===t),on=all.filter(x=>cSel.has(x.e.n)).length;
    inp.indeterminate=on>0&&on<all.length;
    inp.onchange=()=>{all.forEach(x=>inp.checked?cSel.add(x.e.n):cSel.delete(x.e.n));drawCopy()}});
  $('ceach').textContent=cEach?'一つずつ選ぶ ▲':'一つずつ選ぶ ▼';$('clist').style.display=cEach?'block':'none';
  if(cEach){let h='',ps=0;
    cRecs().forEach(({e,i})=>{const s=C[i].s;if(s!==ps){h+=`<div class="cset">第${s}セット</div>`;ps=s}if(e.type==='セット開始')return;
      h+=`<label><input type="checkbox" data-n="${e.n}" ${cSel.has(e.n)?'checked':''}><span class="ct">${fmt(e.t)}</span><span>${esc(e.type)}${e.side?'（'+esc(tn(e.side,e.v))+'）':''}${e.memo.trim()?' <span class="note">'+esc(e.memo.trim())+'</span>':''}</span></label>`});

function closeCopy(){$('mcopy').classList.remove('on')}

/* ---------- CSV ---------- */
const COLS=['video_id','video_title','playlist_id','playlist_index','team_a','team_b','set','seconds','time','rally','score_a','score_b','type','serve_side','serve_team','memo','record_id'];
function buildCSV(vs){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const C=calc();
  const rows=[COLS].concat(L.map((e,i)=>({e,i})).filter(x=>vs.has(x.e.v)).map(({e,i})=>[e.v,e.title,e.list,e.pi>=0?e.pi+1:'',tnI('A',e.v),tnI('B',e.v),C[i].s,e.t,fmt(e.t),C[i].r,C[i].a,C[i].b,e.type,e.side,tnI(e.side,e.v),e.memo,e.uid||'']));
  return rows.map(r=>r.map(q).join(',')).join('\n')}
/* 書き出す動画を選ぶ。初めは再生中の動画だけ選んだ状態。
   再生中の再生リストの動画を先に、ほかの動画（別の再生リストや単独の動画）をあとに並べる */
let eSel=new Set(),eVids=[];
function exportCSV(){if(!L.length){msg('まだ記録がありません');return}
  const now=vidNow(),seen=[...new Set(L.map(e=>e.v))];
  const inList=v=>cur.list&&L.some(e=>e.v===v&&e.list===cur.list);
  eVids=seen.sort((a,b)=>(b===now)-(a===now)||(inList(b)-inList(a))||(order[a]-order[b]));
  eSel=new Set(eVids.includes(now)?[now]:eVids.length===1?eVids:[]);
  drawExp();$('mexp').classList.add('on')}
function drawExp(){const now=vidNow();let h='',sec='';
  eVids.forEach(v=>{const R=L.filter(e=>e.v===v),e0=R[0],n=R.filter(e=>e.type!=='セット開始').length;
    const g=v===now?'再生中の動画':cur.list&&R.some(e=>e.list===cur.list)?'この再生リストのほかの動画':'ほかの動画';
    if(g!==sec){h+=`<div class="cset">${g}</div>`;sec=g}
    h+=`<label><input type="checkbox" data-v="${esc(v)}" ${eSel.has(v)?'checked':''}><span>${e0.pi>=0?(e0.pi+1)+'本目　':''}${esc(TT[v]||e0.title||v)}<span class="vsub">${esc(vsText(v))}・${n}件</span></span></label>`});
  const sc=$('evids').scrollTop;$('evids').innerHTML=h;$('evids').scrollTop=sc;
  $('evids').querySelectorAll('input').forEach(inp=>inp.onchange=()=>{inp.checked?eSel.add(inp.dataset.v):eSel.delete(inp.dataset.v);drawExp()});
  const n=L.filter(e=>eSel.has(e.v)&&e.type!=='セット開始').length;
  $('ego').textContent='書き出す（'+eSel.size+'本・'+n+'件）';$('ego').disabled=!eSel.size;$('ego').style.opacity=eSel.size?1:.5}
function expPick(all){eSel=new Set(all?eVids:eVids.filter(v=>v===vidNow()));drawExp()}
function closeExp(){$('mexp').classList.remove('on')}
function doExp(){if(!eSel.size)return;const csv=buildCSV(eSel);closeExp();
  showOut(csv,'ファイルが保存されない場合は、コピーしてメモアプリなどに貼り付けてください。');
  // ファイル名は「動画タイトル_書き出した日時」。複数の動画なら「最初の動画タイトル_他◯本_日時」
  const vs=eVids.filter(v=>eSel.has(v)),one=vs[0],d=new Date(),p2=x=>String(x).padStart(2,'0');
  const stamp=d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes());
  const ttl=String(TT[one]||(L.find(e=>e.v===one)||{}).title||one).replace(/[\\/:*?"<>|\x00-\x1f]+/g,'_').replace(/\s+/g,' ').trim().slice(0,80)||one;
  const name=ttl+(vs.length>1?'_他'+(vs.length-1)+'本':'')+'_'+stamp+'.csv';
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
    a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}
}
function parseCSV(s){s=s.replace(/^﻿/,'');const rows=[];let r=[],f='',q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){r.push(f);f=''}
    else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''}else if(c!=='\r')f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows}
/* 読み込みは今の記録に追加する。取り込む種類を選べる。
   複数人が同じ動画を別々に記録したものを合わせることを考えて、重複は次のように決める。
   - 記録の固有番号が同じ → 同じ記録
   - サーブ: 同じ動画・同じサーブ側で6秒以内 → 同じサーブ（人によって押すタイミングがずれるため）
   - セット切替: 同じ動画で5分以内 → 同じ
   - それ以外（注目スパイク・見返したい）: 1秒未満の差で、メモが同じか片方が空 → 同じ。メモが違えば別の記録として残す
   重複でも読み込む側にだけあるメモは「今のメモ / 読み込んだメモ」とつなげて残す。
   チーム名は、まだ名前のない動画にはCSVの名前を入れる。
   自分で名前を付けていてCSVと違う動画は、どちらがどちらにあたるかを選んでもらい、その動画は記録上の名前とA・BをCSVに合わせる
   （A・Bが反対なら今までの記録のA・Bを入れ替える）。表示は自分の名前と左右の並びのまま（VW） */
let imp=null;
const TLABEL=t=>t==='セット開始'?'セット切替':t;
/* sw: この動画のA・Bを入れ替えて取り込むとき true（今の記録のA・Bを入れ替えて比べる） */
function findDup(e,sw){if(e.uid){const u=L.find(x=>x.uid===e.uid);if(u)return u}
  return L.find(x=>{if(x.v!==e.v||x.type!==e.type)return false;const d=Math.abs(x.t-e.t),xs=sw?oside(x.side):x.side;
    if(e.type==='サーブ')return xs===e.side&&d<6;
    if(e.type==='セット開始')return d<300;
    if(d>=1||xs!==e.side)return false;
    const a=x.memo.trim(),b=e.memo.trim();return!a||!b||a===b})}
function importCSV(inp){const file=inp.files[0];if(!file)return;const fr=new FileReader();
  fr.onload=()=>{inp.value='';try{
    const rows=parseCSV(fr.result),h=rows.shift(),ix=k=>h.indexOf(k);
    if(ix('seconds')<0||ix('type')<0)throw 0;
    const nm={};
    const recs=rows.filter(r=>r.length>1).map(r=>{const g=k=>ix(k)>=0?(r[ix(k)]||''):'';
      const o=nm[g('video_id')]=nm[g('video_id')]||{},sd=g('serve_side').toLowerCase();
      if(g('team_a'))o.a=g('team_a');if(g('team_b'))o.b=g('team_b');
      if((sd==='a'||sd==='b')&&!o[sd]&&g('serve_team'))o[sd]=g('serve_team');
      const pi=g('playlist_index')?(+g('playlist_index')-1):-1;
      return{t:+g('seconds')||0,type:g('type'),side:g('serve_side'),memo:g('memo'),v:g('video_id'),pi,list:g('playlist_id'),title:g('video_title'),uid:g('record_id')}})
      .filter(e=>e.type&&e.v);
    if(!recs.length)throw 0;
    // 自分で付けた名前とCSVの名前が違う動画。どちらの向きが近いかを文字の重なりで推測しておく
    const sim=(x,y)=>[...new Set(x)].filter(c=>y.includes(c)).length,map={};
    Object.keys(nm).forEach(v=>{const o=nm[v];if(!TN[v]||!o.a||!o.b||(TN[v].a===o.a&&TN[v].b===o.b))return;
      const dA=tn('A',v),dB=tn('B',v);map[v]=sim(dA,o.b)+sim(dB,o.a)>sim(dA,o.a)+sim(dB,o.b)});
    imp={recs,nm,map,on:new Set(recs.map(e=>e.type))};
    const vs=new Set(recs.map(e=>e.v));
    $('ifile').textContent=file.name+'　（動画 '+vs.size+' 本・'+recs.length+' 件）';
    drawImp();$('mimp').classList.add('on')}catch(e){msg('このCSVは読み込めませんでした')}};
  fr.readAsText(file)}
function drawImp(){const types=[...new Set(imp.recs.map(e=>e.type))],mv=Object.keys(imp.map);
  imp.recs.forEach(e=>e.dup=findDup(e,!!imp.map[e.v]));
  $('imap').innerHTML=mv.length?'<div class="mt" style="font-size:14px;margin-top:4px">チーム名の対応</div><div class="note">表示はあなたのチーム名のまま、記録はCSVのチーム名とA・Bに合わせます。</div>'+
    mv.map((v,k)=>{const o=imp.nm[v],l=lside(v),my1=tn(l,v),my2=tn(oside(l),v),side1=l;  // 自分の左・右の名前
      // 選択肢: 自分の左の名前がCSVのどちらにあたるか
      const cs=x=>x==='A'?o.a:o.b,sw=imp.map[v],leftIs=sw?oside(side1):side1;
      const opt=(val,lt)=>`<label><input type="radio" name="imap${k}" data-v="${esc(v)}" value="${val}" ${leftIs===lt?'checked':''}><span>あなたの「${esc(my1)}」＝CSVの「${esc(cs(lt))}」<br>あなたの「${esc(my2)}」＝CSVの「${esc(cs(oside(lt)))}」</span></label>`;
      return`<div class="mapv"><div class="note">${esc(TT[v]||(imp.recs.find(e=>e.v===v)||{}).title||v)}</div>${opt(1,'A')}${opt(2,'B')}</div>`}).join(''):'';
  $('imap').querySelectorAll('input').forEach(inp=>inp.onchange=()=>{const v=inp.dataset.v,lt=inp.value==='1'?'A':'B';
    imp.map[v]=lt!==lside(v);drawImp()});
  $('itypes').innerHTML=types.map((t,k)=>{const all=imp.recs.filter(e=>e.type===t),dup=all.filter(e=>e.dup).length;
    return`<label><input type="checkbox" data-k="${k}" ${imp.on.has(t)?'checked':''}>${esc(TLABEL(t))}<span class="note">（追加 ${all.length-dup}件${dup?'・重複 '+dup+'件':''}）</span></label>`}).join('');
  $('itypes').querySelectorAll('input').forEach(inp=>inp.onchange=()=>{const t=types[+inp.dataset.k];inp.checked?imp.on.add(t):imp.on.delete(t);drawImp()});
  const n=imp.recs.filter(e=>imp.on.has(e.type)&&!e.dup).length;
  $('igo').textContent='追加（'+n+'件）';$('igo').disabled=!n&&!memoFills().length;$('igo').style.opacity=$('igo').disabled?.5:1}
function memoFills(){return imp.recs.filter(e=>{const m=e.memo.trim();return imp.on.has(e.type)&&e.dup&&m&&!e.dup.memo.includes(m)})}
function closeImp(){imp=null;$('mimp').classList.remove('on')}
function doImp(){if(!imp)return;
  const add=imp.recs.filter(e=>imp.on.has(e.type)&&!e.dup),fills=memoFills(),d=inNames();
  fills.forEach(e=>{const a=e.dup.memo.trim(),b=e.memo.trim();e.dup.memo=a?a+' / '+b:b});
  // チーム名の対応: 記録上の名前とA・BをCSVに合わせ、自分の表示名と左右の並びは VW に残す
  Object.keys(imp.map).forEach(v=>{const sw=imp.map[v],o=imp.nm[v],dA=tn('A',v),dB=tn('B',v),fl=!!(VW[v]&&VW[v].flip);
    if(sw){L.forEach(e=>{if(e.v===v)e.side=oside(e.side)});VW[v]={a:dB,b:dA,flip:!fl}}else VW[v]={a:dA,b:dB,flip:fl};
    TN[v]={a:o.a,b:o.b}});
  add.forEach(e=>{if(!TN[e.v]){const o=imp.nm[e.v]||{};TN[e.v]={a:o.a||d.a,b:o.b||d.b}}
    addOrder(e.v,e.pi);if(e.title&&!TT[e.v])TT[e.v]=e.title;
    L.push({t:e.t,type:e.type,side:e.side,memo:e.memo,n:++seq,uid:e.uid||newUid(),v:e.v,pi:e.pi,list:e.list,title:e.title})});
  closeImp();sortL();shownV='';draw();
  const f=add[0];if(f&&!vidNow())openSrc({v:f.v,list:f.list,index:f.pi>=0?f.pi+1:0,t:0},true);
  syncNames();toast(add.length+'件追加しました'+(fills.length?'（メモ '+fills.length+'件）':''))}

/* ---------- 自動保存 ----------
   記録・チーム名はブラウザに保存し、どのタブで開いても使えるようにする（vt_data）。
   ほかのタブで記録が変わったら、このタブの表も合わせる（上書きして消さないように）。
   開いていた動画はタブごとに覚えておき（sessionStorage）、同じタブで読み込み直したときだけ開き直す。
   何も指定せずに新しいタブで開いたときは空の状態にする。
   動画ごとの見ていた位置も覚えておき、同じ動画を開いたらそこから（vt_pos）。
   保存できない環境（プライベートブラウズなど）のときだけ、閉じる前に確認を出す */
const SKEY='vt_data',PKEY='vt_pos',TKEY='vt_tab';
let saveOK=false,restored=false,syncing=false,lastData='',tabSrc=null,POS={};
function save(){if(!restored||syncing)return;let t=0,v=cur.v,st=-1;
  try{if(ready){v=vidNow()||cur.v;t=Math.floor(P.getCurrentTime()||0);st=P.getPlayerState()}}catch(e){}
  // まだ再生していない間は位置が0になるので、前に覚えた位置を残す
  const live=!(st===-1||st===5||!t);
  if(v&&live)POS[v]=t;
  if(v||cur.list)tabSrc={v,list:cur.list,t:v?POS[v]||0:0};
  try{
    const data=JSON.stringify({ver:1,L,TN,VW,order});
    if(data!==lastData){localStorage.setItem(SKEY,data);lastData=data}
    const ks=Object.keys(POS);if(ks.length>300)ks.slice(0,ks.length-300).forEach(k=>delete POS[k]);
    localStorage.setItem(PKEY,JSON.stringify(POS));saveOK=true}catch(e){saveOK=false}
  try{if(tabSrc)sessionStorage.setItem(TKEY,JSON.stringify(tabSrc))}catch(e){}}
function applyData(d){
  L=Array.isArray(d.L)?d.L:[];TN=d.TN||{};VW=d.VW||{};order=d.order||{};
  seq=Math.max(seq,L.reduce((m,e)=>Math.max(m,e.n||0),0));
  L.forEach(e=>{if(!e.uid)e.uid=newUid();if(e.title&&!TT[e.v])TT[e.v]=e.title})}
function restoreData(){let d=null;
  try{lastData=localStorage.getItem(SKEY)||'';d=JSON.parse(lastData||'null')}catch(e){}
  try{POS=JSON.parse(localStorage.getItem(PKEY)||'{}')||{}}catch(e){POS={}}
  try{tabSrc=JSON.parse(sessionStorage.getItem(TKEY)||'null')}catch(e){tabSrc=null}
  restored=true;
  if(d&&d.ver===1){applyData(d);
    if(d.src&&d.src.v&&!(d.src.v in POS))POS[d.src.v]=d.src.t||0}}  // 前の版の保存形式から位置を引き継ぐ
window.addEventListener('storage',e=>{if(e.key!==SKEY||!e.newValue||e.newValue===lastData)return;
  let d=null;try{d=JSON.parse(e.newValue)}catch(x){}if(!d||d.ver!==1)return;
  lastData=e.newValue;applyData(d);
  // 開いているポップアップは古い記録を見ているので閉じる
  if(imp)closeImp();if($('mcopy').classList.contains('on'))closeCopy();if($('mexp').classList.contains('on'))closeExp();
  syncing=true;try{const v=vidNow();if(v&&TN[v]){const n=dispLR(v);$('ta').value=n.a;$('tb').value=n.b}draw()}finally{syncing=false}});
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('beforeunload',e=>{if(L.length&&!saveOK){e.preventDefault();e.returnValue=''}});
$('ta').oninput=$('tb').oninput=()=>{const v=vidNow();if(v){shownV=v;namesFromInputs(v)}draw();updateURL()};
restoreData();
draw();
/* URLに動画の指定があればそれを開く。なければ、このタブで開いていた動画（読み込み直したとき）。
   どちらもなければ空のまま。同じ動画なら前に見ていた位置から */
let first=fromPage();
if(!first&&tabSrc&&(tabSrc.v||tabSrc.list))first={v:tabSrc.v||'',list:tabSrc.list||'',index:0,t:0};
if(first&&!first.t){if(!first.v&&first.list&&tabSrc&&tabSrc.list===first.list)first.v=tabSrc.v||'';if(first.v&&POS[first.v])first.t=POS[first.v]}
if(first)openSrc(first,true);
</script></body></html>
